name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write # Changed to 'write' to allow version bump commit
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Predict.Client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # Important for git operations

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: "./Predict.Client/package-lock.json"

      # ✅ ADD BUMP VERSION HERE - BEFORE install and build
      - name: Bump version
        run: |
          cd ./Predict.Client
          node scripts/bump-version.js

      # ✅ Then install dependencies
      - name: Install dependencies
        run: npm install

      # ✅ Then build the app
      - name: Build Angular app
        run: npm run build -- --configuration production --base-href "/predict/"

      # ✅ Generate version.json from the bumped version
      - name: Generate version.json
        run: |
          cd ./Predict.Client
          VERSION=$(node -p "require('./package.json').version")
          DATE=$(date -I)
          echo "{\"version\":\"$VERSION\",\"releaseDate\":\"$DATE\"}" > ./dist/predict.client/browser/assets/version.json

      - name: List build output
        run: ls -la ./Predict.Client/dist/predict.client/browser

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./Predict.Client/dist/predict.client/browser"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Optional: Commit the bumped version back to repo
      - name: Commit version bump
        if: success()
        run: |
          cd ./Predict.Client
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          git diff --staged --quiet || git commit -m "chore: bump version to $(node -p "require('./package.json').version")"
          git push

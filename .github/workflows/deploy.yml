name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Predict.Client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Ensure we get all files even if .git is missing
          clean: false

      - name: Verify repository state
        run: |
          pwd
          ls -la
          git status || echo "Not a git repository, continuing..."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: "npm"
          cache-dependency-path: "./Predict.Client/package-lock.json"

      - name: Install dependencies
        run: |
          npm install
          # If install fails, try with --legacy-peer-deps
          # npm install --legacy-peer-deps

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: List build output
        run: ls -la ./dist/predict.client || echo "Build directory not found"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./Predict.Client/dist/predict.client"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

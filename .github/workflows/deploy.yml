name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write # Needed for version bump commit
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Predict.Client # All commands run from here

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: "./Predict.Client/package-lock.json"

      # ✅ CORRECT - No cd needed
      - name: Bump version
        run: node scripts/bump-version.js

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npm run build -- --configuration production --base-href "/predict/"

      # ✅ CORRECT - No cd needed
      - name: Generate version.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DATE=$(date -I)
          echo "{\"version\":\"$VERSION\",\"releaseDate\":\"$DATE\"}" > ./dist/predict.client/browser/assets/version.json

      - name: List build output
        run: ls -la ./dist/predict.client/browser

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./Predict.Client/dist/predict.client/browser"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

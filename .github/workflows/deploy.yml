name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Predict.Client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: "npm"
          cache-dependency-path: "./Predict.Client/package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Build Angular app with version
        run: npm run gh-build

      - name: Verify version.json exists
        run: |
          if [ -f "./dist/predict.client/version.json" ]; then
            echo "✅ version.json created successfully"
            cat ./dist/predict.client/version.json
          else
            echo "❌ version.json not found!"
            exit 1
          fi

      - name: List build output
        run: ls -la ./dist/predict.client/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./Predict.Client/dist/predict.client"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

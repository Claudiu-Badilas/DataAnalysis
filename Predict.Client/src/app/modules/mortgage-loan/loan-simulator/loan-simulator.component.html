<p-top-bar [hasModuleNavContent]="true" [hasFiltersContent]="true">
  <ng-container module-navigation>
    <p-toggle-button-actions
      [options]="['Overview', 'Detailed', 'Compare']"
      [selected]="'Overview'"
      (selectionChange)="onSelectionChange($event)"
    />
  </ng-container>
  <ng-container filter-content>
    <div class="pt-2">
      <p-dropdown-select
        [items]="dropDownSelectOptions$ | async"
        [selectedItem]="selectedRepaymentScheduleName$ | async"
        placeholder="No Selection"
        (selectionChange)="onDropdownSelected($event)"
      />
    </div>
    <div class="pt-2">
      <p-numeric-input
        id="targetAmount"
        label="Monthly Amount"
        [value]="monthlyAmount()"
        (valueChange)="onMonthlyAmountChange($event)"
      />
    </div>
    <div class="pt-2">
      <p-numeric-input
        id="targetAmount"
        label="Payments"
        [value]="payments()"
        (valueChange)="onPaymentsChange($event)"
      />
    </div>
  </ng-container>
</p-top-bar>
<div class="m-2">
  <p-loan-simulator-header
    [monthlyInstalmentGroups]="monthlyInstalmentBatches()"
  ></p-loan-simulator-header>

  <p-loan-simulator-body-table
    [monthlyInstalmentGroups]="monthlyInstalmentBatches()"
  />
</div>

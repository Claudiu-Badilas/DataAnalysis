<div class="storage-card">
  <div class="storage-card-header">
    <div class="storage-card-title">
      <span>Storage Keys</span>
      <label class="upload-btn">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M12 16V4M8 8L12 4L16 8"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M4 20H20"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <input
          type="file"
          class="hidden-input"
          accept=".json"
          (change)="onFileSelected($event)"
        />
      </label>
    </div>
    <div class="storage-count">{{ storageKeys.length }} items</div>
  </div>

  @if (storageKeys.length === 0) {
    <div class="empty-state">
      <svg
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M20 12V8H4V12M20 12L4 12M20 12V16H4V12M4 12H2M22 12H20M4 12H2M4 16H2M22 16H20M4 16V20H20V16"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
        <path
          d="M8 6H16"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
      <p>No stored items found</p>
      <span>Upload a JSON file to get started</span>
    </div>
  } @else {
    <div class="storage-list">
      @for (item of storageKeys; track item.key) {
        <div class="storage-item">
          <div class="storage-item-info">
            <span class="storage-item-key">{{ item.key }}</span>
            <span
              class="storage-item-type"
              [class.local]="item.storageType === 'local'"
              [class.session]="item.storageType === 'session'"
            >
              {{ item.storageType }}
            </span>
          </div>

          <div class="storage-item-actions">
            <button
              class="action-btn download-btn"
              (click)="downloadItem(item)"
              title="Download"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M12 16V4M8 12L12 16L16 12"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M4 20H20"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <button
              class="action-btn delete-btn"
              (click)="removeItem(item)"
              title="Delete"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M18 6L6 18M6 6L18 18"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>

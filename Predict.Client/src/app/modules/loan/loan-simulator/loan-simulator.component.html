<p-top-bar [hasModuleNavContent]="true" [hasFiltersContent]="true">
  <ng-container module-navigation>
    <div class="d-flex align-items-center justify-content-center">
      <p-toggle-button-actions
        [options]="['Overview', 'Detailed', 'Compare']"
        [selected]="'Overview'"
        (selectionChange)="onSelectionChange($event)"
      />
    </div>
  </ng-container>
  <ng-container filter-content>
    <div class="pt-2">
      <p-dropdown-select
        [items]="dropDownSelectOptions$ | async"
        [selectedItem]="selectedRepaymentScheduleName$ | async"
        placeholder="No Selection"
        (selectionChange)="onDropdownSelected($event)"
      />
    </div>
    <div class="pt-2">
      <p-numeric-input
        id="targetAmount"
        label="Monthly Amount"
        [value]="monthlyAmount()"
        (valueChange)="onMonthlyAmountChange($event)"
      />
    </div>
    <div class="pt-2">
      <p-numeric-input
        id="targetAmount"
        label="Payments"
        [value]="payments()"
        (valueChange)="onPaymentsChange($event)"
      />
    </div>

    <div class="pt-2 d-flex align-items-center justify-content-between">
      <div class="sidebar-label">Dobanda Fixa 5.79%</div>
      <div>
        <p-foo-toggle
          [toggle]="calculateRepaymentSchedules()"
          (toggleChange)="onCalculateRepaymentSchedulesChanged($event)"
        />
      </div>
    </div>
  </ng-container>
</p-top-bar>
<div class="m-2">
  <p-loan-simulator-header
    [monthlyInstalmentGroups]="monthlyInstalmentBatches()"
  ></p-loan-simulator-header>

  <p-loan-simulator-body-table
    [monthlyInstalmentGroups]="monthlyInstalmentBatches()"
  />
</div>

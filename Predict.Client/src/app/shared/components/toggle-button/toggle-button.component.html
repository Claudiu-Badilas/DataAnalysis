<div class="toggle-wrapper d-flex align-items-center justify-content-center">
  <div class="toggle-background"></div>

  @for (option of options; track option) {
    <div
      class="toggle-option"
      [ngClass]="{ active: option.label === _selected() }"
      (click)="select(option.label)"
    >
      @if (option.iconPath) {
        <img
          [src]="option.iconPath"
          alt="{{ option.label }} icon"
          class="option-icon"
        />
      } @else {
        {{ option.label }}
      }
    </div>
  }

  <div
    class="toggle-slider"
    [style.width.%]="100 / options.length"
    [style.transform]="
      'translateX(' + options.map(o => o.label).indexOf(_selected()) * 100 + '%)'
    "
    [style.background]="gradientStyle"
  ></div>
</div>

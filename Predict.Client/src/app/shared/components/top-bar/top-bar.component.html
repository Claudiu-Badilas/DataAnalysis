<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <img src="assets/icons/logo.svg" alt="no-image" />
      <span class="brand__name">Predict</span>
    </div>

    <div class="module-nav">
      <ng-content select="[module-navigation]"></ng-content>
    </div>

    <div class="actions actions--desktop">
      @for (option of modules; track option) {
        <button
          type="button"
          class="actions__link"
          (click)="onNavigateTo(option.url)"
        >
          <ng-container [ngSwitch]="option.icon">
            <!-- wallet -->
            <svg
              *ngSwitchCase="'wallet'"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1"
              />
              <path d="M16 12h5v4h-5a2 2 0 1 1 0-4z" />
            </svg>
            <!-- trending down -->
            <svg
              *ngSwitchCase="'trending'"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="22 17 13.5 8.5 8.5 13.5 2 7" />
              <polyline points="16 17 22 17 22 11" />
            </svg>
            <!-- file -->
            <svg
              *ngSwitchCase="'file'"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
            </svg>
            <!-- receipt -->
            <svg
              *ngSwitchCase="'receipt'"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 2V2z" />
              <path d="M8 7h8M8 11h8M8 15h5" />
            </svg>
            <!-- settings -->
            <svg
              *ngSwitchCase="'settings'"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
              />
            </svg>
          </ng-container>
          <span class="action-label">{{ option.label }}</span>
        </button>
      }
    </div>

    <div class="actions actions--mobile" *ngIf="!hasModuleNavContent">
      @for (option of modules; track option) {
        <button
          type="button"
          class="actions__link"
          (click)="onNavigateTo(option.url)"
        >
          <img [src]="'assets/icons/{{option.icon}}.svg'" />
        </button>
      }
    </div>

    <!-- Burger Menu - Only shown when module-nav has content AND on mobile -->
    <div class="mobile-menu" *ngIf="hasModuleNavContent">
      <button
        class="burger-btn"
        [class.active]="isMenuOpen"
        (click)="toggleMenu()"
      >
        ☰
      </button>

      <div class="dropdown-menu" *ngIf="isMenuOpen">
        <div class="dropdown-header">
          <span class="dropdown-title">Menu</span>
          <button class="close-btn" (click)="closeMenu()">✕</button>
        </div>
        <div class="dropdown-items">
          @for (option of modules; track option) {
            <button
              class="dropdown-item"
              (click)="onNavigateTo(option.url); closeMenu()"
            >
              <img [src]="'assets/icons/{{option.icon}}.svg'" />
              <span>{{ option.label }}</span>
            </button>
          }
        </div>
      </div>
    </div>

    <!-- Overlay -->
    <div class="menu-overlay" *ngIf="isMenuOpen" (click)="closeMenu()"></div>
  </div>
</header>
